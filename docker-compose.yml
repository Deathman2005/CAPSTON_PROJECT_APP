version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smsshield_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smsshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smsshield_dev_secret_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-smsshield}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smsshield} -d ${POSTGRES_DB:-smsshield}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smsshield_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smsshield_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-smsshield}:${POSTGRES_PASSWORD:-smsshield_dev_secret_change_in_prod}@postgres:5432/${POSTGRES_DB:-smsshield}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - smsshield_network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: smsshield_dashboard
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smsshield_network

volumes:
  postgres_data:
    driver: local

networks:
  smsshield_network:
    driver: bridge
